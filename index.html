<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四方相通</title>
<style>
  :root{
    /* 預設：優雅暖色專業 */
    --bg:#f0ebe3; --card:#fdfbf7; --card2:#f6f1e9; --ink:#2e2823; --ink-soft:#8b8175; --ink3:#b0a89c;
    --line:#e7ded1; --line2:#efe8dc; --brand:#a15843; --brand-ink:#ffffff; --danger:#b04a3a; --ok:#5a8567;
    --zao:#c08a42; --zhong:#4f8189; --wan:#75698f;
    --st-todo:#b3823f; --st-doing:#4f8189; --st-done:#5a8567;
    --shift:var(--brand); --radius:16px; --radius-sm:11px;
    --shadow:0 2px 8px rgba(90,65,45,.06),0 1px 2px rgba(90,65,45,.04);
    --shadow-lg:0 8px 30px rgba(90,65,45,.14);
  }
  body.theme-classic{
    --bg:#f5f4ef; --card:#ffffff; --card2:#f3f2ec; --ink:#26262e; --ink-soft:#6b6b78; --ink3:#a8a8b0;
    --line:#e6e4dd; --line2:#eeece5; --brand:#3a4a63; --danger:#b3453c; --ok:#2f8f6b;
    --zao:#e0912f; --zhong:#3d8ea0; --wan:#5a5686;
    --st-todo:#c9772a; --st-doing:#2f7d90; --st-done:#2f8f6b;
    --shadow:0 2px 8px rgba(30,30,45,.06);--shadow-lg:0 8px 26px rgba(30,30,45,.1);
  }
  body.theme-modern{
    --bg:#f6f6f7; --card:#ffffff; --card2:#f1f1f3; --ink:#18181b; --ink-soft:#71717a; --ink3:#a1a1aa;
    --line:#eaeaec; --line2:#f0f0f2; --brand:#2563eb; --danger:#dc2626; --ok:#16a34a;
    --zao:#e0912f; --zhong:#3d8ea0; --wan:#6366f1;
    --st-todo:#d97706; --st-doing:#0891b2; --st-done:#16a34a;
    --shadow:0 1px 3px rgba(0,0,0,.06);--shadow-lg:0 8px 26px rgba(0,0,0,.09);
  }
  body.dark{
    --bg:#1b1815; --card:#26221d; --card2:#2f2a24; --ink:#ede7df; --ink-soft:#a49a8c; --ink3:#7a7266;
    --line:#3a352d; --line2:#332e28; --brand:#c07a5f; --brand-ink:#ffffff; --danger:#e0655c; --ok:#6aab84;
    --zao:#d0964a; --zhong:#5a9aa2; --wan:#9488ae;
    --st-todo:#d0964a; --st-doing:#5a9aa2; --st-done:#6aab84;
    --shadow:0 6px 24px rgba(0,0,0,.4);--shadow-lg:0 10px 34px rgba(0,0,0,.5);
  }
  body.dark .composer-line textarea,
  body.dark .search-box,
  body.dark .pick,
  body.dark .filter select,
  body.dark input[type="password"],
  body.dark select,
  body.dark .edit-ta{background-color:#2c2f38;color:var(--ink);}
  body.dark .refresh{background:#2c2f38;}
  body.dark select option{background:#2a2d36;color:#e8e8ec;}
  body.dark .pick option{background:#2a2d36;color:#e8e8ec;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:"PingFang TC","PingFang SC","Microsoft JhengHei","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;}
  button{font-family:inherit;cursor:pointer;}
  button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--shift);outline-offset:2px;}

  /* ---------- 登入 ---------- */
  #login-view{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{width:100%;max-width:400px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
  .shift-band{height:8px;background:linear-gradient(90deg,var(--zao),var(--zhong),var(--wan));transition:background .4s ease;}
  .login-inner{padding:32px 30px 34px;}
  .login-title{font-size:26px;font-weight:700;letter-spacing:.12em;margin:0 0 4px;}
  .login-sub{color:var(--ink-soft);font-size:14px;margin:0 0 26px;}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:7px;letter-spacing:.02em;}
  input[type="password"],select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:#fbfaf7;color:var(--ink);font-size:16px;}
  select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%236b6b78' stroke-width='1.6' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:36px;}
  select:disabled{opacity:.5;cursor:not-allowed;}
  .shift-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .shift-tab{padding:12px 4px;border:1px solid var(--line);border-radius:10px;background:#fbfaf7;color:var(--ink-soft);font-size:15px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:5px;transition:.15s;}
  .shift-tab .ico{font-size:20px;line-height:1;}
  .shift-tab[aria-pressed="true"]{color:#fff;border-color:transparent;}
  .shift-tab[data-shift="早班"][aria-pressed="true"]{background:var(--zao);}
  .shift-tab[data-shift="中班"][aria-pressed="true"]{background:var(--zhong);}
  .shift-tab[data-shift="晚班"][aria-pressed="true"]{background:var(--wan);}
  .btn-primary{width:100%;padding:14px;border:none;border-radius:10px;background:var(--shift);color:var(--brand-ink);font-size:16px;font-weight:700;letter-spacing:.06em;transition:background .3s ease,filter .15s;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-primary:disabled{background:#c9c7bf;cursor:not-allowed;}
  .login-msg{min-height:20px;margin-top:12px;font-size:13px;color:var(--danger);text-align:center;}

  /* ---------- 主畫面 ---------- */
  #app-view{display:none;min-height:100dvh;flex-direction:column;}
  .topbar{background:var(--shift);background-image:linear-gradient(160deg,rgba(255,255,255,.08),rgba(0,0,0,.14));color:#fff;padding:15px 20px;display:flex;align-items:center;gap:12px;transition:background .3s ease;}
  .who{display:flex;align-items:center;gap:9px;min-width:0;}
  .badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.22);white-space:nowrap;}
  .who-name{font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .topbar .spacer{flex:1;}
  .counts{display:flex;gap:6px;margin-left:10px;flex-wrap:wrap;}
  .cbadge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.2);color:#fff;white-space:nowrap;}
  .cbadge.warn{background:#fff;color:var(--danger);}
  .tbtn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:15px;line-height:1;padding:6px 10px;border-radius:8px;margin-right:8px;}
  .tbtn:hover{background:rgba(255,255,255,.28);}
  .logout{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:13px;padding:7px 12px;border-radius:8px;}
  .logout:hover{background:rgba(255,255,255,.28);}
  .wrap{max-width:760px;width:100%;margin:0 auto;padding:18px 16px 60px;}

  .status{font-size:12.5px;padding:8px 12px;border-radius:9px;margin-bottom:14px;display:flex;align-items:center;gap:7px;}
  .status .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .status.cloud{background:#eaf5f0;color:#256b52;} .status.cloud .dot{background:var(--ok);}
  .status.local{background:#fbf3e6;color:#8a5a12;} .status.local .dot{background:var(--zao);}
  .status.err{background:#faeceb;color:#93362e;} .status.err .dot{background:var(--danger);}
  .board{position:relative;background:linear-gradient(175deg,#fbefc6,#f7e7ad);border-radius:var(--radius);box-shadow:0 3px 14px rgba(180,150,60,.16);margin-bottom:22px;border:1px solid #f0dd9c;}
  .board::before{content:"";position:absolute;top:-1px;left:26px;width:46px;height:5px;background:#e0c56a;border-radius:0 0 5px 5px;opacity:.5;}
  .board-head{display:flex;align-items:center;gap:10px;padding:12px 16px 8px;cursor:pointer;}
  .board-title{font-size:13.5px;font-weight:800;color:#7c5e1c;letter-spacing:.04em;}
  .board-date{font-size:11.5px;color:#b09646;}
  .board-tools{margin-left:auto;display:flex;gap:6px;}
  .board-btn{background:rgba(255,255,255,.55);border:1px solid #e6d68a;color:#7c5e1c;font-size:12px;padding:4px 11px;border-radius:8px;cursor:pointer;transition:.12s;}
  .board-btn:hover{background:#fff;}
  .board-body{padding:0 16px 14px;}
  .board.collapsed .board-body{display:none;}
  .board-body textarea{width:100%;min-height:66px;resize:vertical;border:1px solid #ecdd8e;border-radius:10px;background:#fffbe8;padding:11px 13px;font-size:14.5px;color:#5a4a1e;font-family:inherit;line-height:1.6;}
  .board-body textarea::placeholder{color:#c4ad63;}
  .board-foot{display:flex;justify-content:flex-end;min-height:16px;margin-top:5px;}
  .board-status{font-size:12px;color:var(--ok);}
  body.dark .board{background:linear-gradient(175deg,#332f1b,#2a2718);border-color:#4a4526;}
  body.dark .board::before{background:#5a5330;}
  body.dark .board-title{color:#e6d28a;} body.dark .board-date{color:#b0a26a;}
  body.dark .board-btn{background:rgba(255,255,255,.08);border-color:#5a5330;color:#e6d28a;}
  body.dark .board-body textarea{background:#2a2818;border-color:#4a4526;color:#e6dcae;}
  .toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:10px 22px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2);opacity:0;transition:opacity .25s,transform .25s;z-index:9999;pointer-events:none;}
  .rmodal-mask{position:fixed;inset:0;background:rgba(40,30,22,.45);display:none;align-items:center;justify-content:center;z-index:10000;padding:20px;}
  .rmodal-mask.show{display:flex;}
  .rmodal{width:100%;max-width:360px;background:var(--card);border-radius:var(--radius);box-shadow:0 20px 60px rgba(50,35,25,.35);padding:20px;animation:pop .18s ease;}
  .rmodal-h{font-size:16px;font-weight:800;color:var(--ink);margin-bottom:4px;}
  .rmodal-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rmodal-quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
  .rmodal-quick button{padding:10px;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.12s;}
  .rmodal-quick button:hover{border-color:var(--brand);color:var(--brand);}
  .rmodal-custom{display:flex;align-items:center;gap:8px;padding-top:14px;border-top:1px solid var(--line);margin-bottom:16px;}
  .rmodal-lbl{font-size:13px;color:var(--ink-soft);white-space:nowrap;}
  .rmodal-custom input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card2);color:var(--ink);font-size:13.5px;font-family:inherit;}
  .rmodal-custom #remindSet{padding:8px 14px;border:none;border-radius:9px;background:var(--brand);color:#fff;font-size:13px;font-weight:700;cursor:pointer;}
  .rmodal-foot{display:flex;justify-content:space-between;align-items:center;}
  .rmodal-clear{background:none;border:none;color:var(--danger);font-size:13px;font-weight:600;cursor:pointer;padding:6px;}
  .rmodal-cancel{background:var(--card2);border:1px solid var(--line);color:var(--ink-soft);font-size:13px;padding:8px 18px;border-radius:9px;cursor:pointer;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  body.dark .toast{background:#3a3d47;}

  /* 分頁 */
  .tabs{display:inline-flex;gap:2px;background:var(--card2);padding:4px;border-radius:12px;margin-bottom:20px;}
  .tab{background:none;border:none;padding:8px 18px;font-size:14px;font-weight:700;color:var(--ink-soft);position:relative;letter-spacing:.03em;border-radius:9px;cursor:pointer;transition:.15s;}
  .tab[aria-selected="true"]{color:var(--brand);background:var(--card);box-shadow:var(--shadow);}
  .pane{display:none;} .pane.on{display:block;}

  /* 登記表單 */
  .composer{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:18px;}
  .composer-line{display:flex;gap:10px;align-items:flex-start;}
  .composer-line textarea{flex:1;min-width:0;min-height:44px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:#fbfaf7;padding:11px 12px;font-size:15px;color:var(--ink);font-family:inherit;line-height:1.5;}
  .composer-line select{flex:none;width:130px;padding:11px 32px 11px 12px;border:1px solid var(--line);border-radius:10px;background:#fbfaf7;font-size:15px;color:var(--ink);appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%236b6b78' stroke-width='1.6' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 12px center;}
  .composer-row{display:flex;justify-content:flex-end;margin-top:10px;}
  .btn-add{padding:11px 24px;border:none;border-radius:11px;background:var(--shift);color:#fff;font-size:15px;font-weight:700;box-shadow:0 3px 10px color-mix(in srgb,var(--brand) 30%,transparent);transition:filter .15s,transform .12s;}
  .btn-add:active{transform:translateY(1px);}
  .btn-add:hover{filter:brightness(1.06);}
  .btn-add:disabled{background:#c9c7bf;cursor:not-allowed;}

  .list-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .list-head h2{font-size:15px;margin:0;letter-spacing:.04em;color:var(--ink);}
  .todo-badges{display:inline-flex;gap:6px;}
  .tbadge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);cursor:pointer;transition:.12s;}
  .tbadge:hover{border-color:var(--ink-soft);}
  .tbadge.tb-todo.active{background:var(--zao);border-color:transparent;color:#fff;}
  .tbadge.tb-chase{color:var(--danger);border-color:#e6bdb9;}
  .tbadge.tb-chase.active{background:var(--danger);border-color:transparent;color:#fff;}
  .count{color:var(--ink-soft);font-size:13px;}
  .head-tools{margin-left:auto;display:flex;align-items:center;gap:8px;}
  .refresh{border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font-size:13px;padding:7px 12px;border-radius:8px;}
  .refresh:hover{color:var(--ink);} .refresh.spin{opacity:.6;pointer-events:none;}
  .search-box{width:180px;padding:7px 11px;font-size:14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);}
  .search-box::placeholder{color:#a8a8b0;}
  .filter select{width:auto;padding:7px 30px 7px 11px;font-size:14px;background-color:var(--card);border:1px solid var(--line);border-radius:8px;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%236b6b78' stroke-width='1.6' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 10px center;}

  .empty{text-align:center;color:var(--ink-soft);padding:44px 20px;background:var(--card);border-radius:var(--radius);border:1px dashed var(--line);}
  .empty .big{font-size:34px;margin-bottom:8px;}

  /* 紀錄卡 */
  .rec{position:relative;overflow:hidden;display:flex;align-items:flex-start;gap:18px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:13px;border:1px solid var(--line2);animation:pop .18s ease;transition:transform .15s,box-shadow .15s;}
  .rec:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg);}
  .rec::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line);}
  @keyframes pop{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
  .rec[data-shift="早班"]::before{background:var(--zao);}
  .rec[data-shift="中班"]::before{background:var(--zhong);}
  .rec[data-shift="晚班"]::before{background:var(--wan);}
  @keyframes warnblink{0%,100%{background:var(--card);}50%{background:color-mix(in srgb,var(--danger) 12%,var(--card));}}
  .rec.warn{animation:warnblink 1.1s ease-in-out infinite;box-shadow:0 0 0 1px color-mix(in srgb,var(--danger) 45%,transparent) inset,var(--shadow);}
  .rec.warn::before{background:var(--danger)!important;}
  @media(prefers-reduced-motion:reduce){.rec.warn{animation:none;background:color-mix(in srgb,var(--danger) 10%,var(--card));}}
  @keyframes dueblink{0%,100%{background:var(--card);}50%{background:color-mix(in srgb,var(--warn) 16%,var(--card));}}
  .rec.due{animation:dueblink 1.1s ease-in-out infinite;box-shadow:0 0 0 1px color-mix(in srgb,var(--warn) 45%,transparent) inset,var(--shadow);}
  .rec.due::before{background:var(--warn)!important;}
  @media(prefers-reduced-motion:reduce){.rec.due{animation:none;background:color-mix(in srgb,var(--warn) 12%,var(--card));}}
  .rec-rem{flex:none;background:none;border:none;color:var(--ink-soft);font-size:12.5px;padding:5px 8px;border-radius:8px;cursor:pointer;}
  .rec-rem:hover{background:var(--card2);color:var(--warn);}
  .rec-rem.on{color:var(--warn);font-weight:600;}
  .rec-rem.due{color:var(--danger);font-weight:700;}
  .rec-dismiss{flex:none;background:var(--warn);border:none;color:#fff;font-size:12px;font-weight:700;padding:5px 10px;border-radius:8px;cursor:pointer;}
  .cbadge.due{background:#fff;color:var(--warn);}
  .rec-side{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:92px;max-width:150px;}
  .person-row{display:flex;align-items:center;gap:3px;flex-wrap:wrap;}
  .icon-btn{background:none;border:none;cursor:pointer;font-size:13px;padding:2px 4px;border-radius:6px;line-height:1;opacity:.5;transition:.12s;}
  .icon-btn:hover{opacity:1;background:var(--card2);}
  .icon-btn.on{opacity:1;}
  .icon-btn.rem.due{opacity:1;animation:iconblink 1s ease-in-out infinite;}
  @keyframes iconblink{50%{opacity:.25;}}
  .icon-btn.dis{color:var(--warn);opacity:1;font-weight:800;}
  .tag{font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:999px;color:#fff;letter-spacing:.06em;}
  .tag[data-shift="早班"]{background:var(--zao);}
  .tag[data-shift="中班"]{background:var(--zhong);}
  .tag[data-shift="晚班"]{background:var(--wan);}
  .rec-person{font-size:13.5px;font-weight:700;color:var(--ink);}
  .rec-time{font-size:11px;color:var(--ink3);letter-spacing:.02em;}
  .rec-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;}
  .rec-body{flex:1 1 260px;min-width:200px;font-size:15.5px;color:var(--ink);white-space:pre-wrap;word-break:break-word;line-height:1.5;}
  .rec-fields{flex:0 0 auto;}
  .ordno{color:var(--brand);font-weight:700;cursor:pointer;border-bottom:1px dashed currentColor;}
  .ordno:hover{background:var(--brand-soft,rgba(160,88,67,.1));border-radius:3px;}
  .ordno.copied{color:var(--ok);border-bottom-color:transparent;}
  .rec-fields{flex:none;display:flex;gap:9px;align-items:center;flex-wrap:wrap;}
  .minifield{display:flex;align-items:center;gap:6px;}
  .minifield .k{font-size:12px;color:var(--ink-soft);}
  .pick{appearance:none;border:1px solid transparent;border-radius:999px;padding:6px 28px 6px 13px;font-size:12.5px;font-weight:700;background:var(--card2);color:var(--ink);cursor:pointer;letter-spacing:.02em;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='7' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%238b8175' stroke-width='1.6' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 10px center;}
  .pick.st-todo{color:var(--st-todo);background-color:color-mix(in srgb,var(--st-todo) 12%,var(--card));}
  .pick.st-doing{color:var(--st-doing);background-color:color-mix(in srgb,var(--st-doing) 12%,var(--card));}
  .pick.st-done{color:var(--st-done);background-color:color-mix(in srgb,var(--st-done) 13%,var(--card));}
  .pick.hs-doing{color:var(--st-doing);background-color:color-mix(in srgb,var(--st-doing) 13%,var(--card));}
  .pick.hs-supp{color:#fff;background-color:var(--danger);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='7' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23ffffff' stroke-width='1.6' stroke-linecap='round'/></svg>");}

</div>

  function buildMini(){

    var now=Date.now(), todo=[], given=[];

        if(r.id===miniEditingId){ h+='<div class="m-i">'+editCell(r)+'</div>'; return; }
        h+='<div class="m-i'+(isPinned(r)?' mpin':'')+(isDue(r)?' mdue':'')+'"><div class="m-row"><span class="m-txt">'+(isPinned(r)?'📌 ':'')+(hasRemind(r)?'⏰ ':'')+miniBody(r.content)+'</span></div>'+
           '<div class="m-sub">'+r.shift+' · '+esc(r.person)+(hasRemind(r)?(' · ⏰'+fmtRemind(remindAt(r))+(isDue(r)?'（到點）':'')):'')+'</div>'+

    if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); if(!addBtn.disabled) addRecord(); }
  });
  addBtn.addEventListener("click", addRecord);
  function summ(t){ t=t.replace(/\s+/g," ").trim(); return t.length>16 ? t.slice(0,16)+"…" : t; }
  function extractOrders(text){
    var re=/[0-9A-Za-z]{8,}/g, m, out=[]; text=String(text||"");
    while((m=re.exec(text))){ if((m[0].match(/[0-9]/g)||[]).length>=8) out.push(m[0]); }
    return out;
  }
  function findDuplicate(text){
    var orders=extractOrders(text), plain=text.trim();
    for(var i=0;i<records.length;i++){
      var r=records[i]; if(isBoard(r)||isArchived(r)) continue;
      if(orders.length){
        var ro=extractOrders(r.content);
        for(var j=0;j<orders.length;j++){ if(ro.indexOf(orders[j])>=0) return { rec:r, order:orders[j] }; }
      }else if(r.content.trim()===plain){ return { rec:r, order:null }; }
    }
    return null;
  }
  function addRecord(){
    var text=content.value.trim(); if(!text || !current) return;
    var dup=findDuplicate(text);
    if(dup){
      var d=dup.rec, ps=parseStatus(d.status);
      var msg=(dup.order ? ("這張訂單「"+dup.order+"」可能已經登記過：") : "這筆事由可能已經登記過：")+
        "\n\n"+d.shift+" "+d.person+"（"+fmt(d.time)+"）\n"+d.content+
        "\n狀態："+ps.base+(d.handler?("／"+d.handler):"")+
        "\n\n仍要再登記一筆嗎？";
      if(!window.confirm(msg)) return;
    }
    var handlerVal = newHandler.value ? (current.person+" "+newHandler.value) : "";
    var rec={ id:Date.now()+"-"+Math.random().toString(36).slice(2,7), content:text,
      shift:current.shift, person:current.person, time:Date.now(),
      status:encodeStatus(newStatus.value), handler:handlerVal };
    var logText="新增事項「"+summ(text)+"」";
    if(USE_CLOUD){
      records.unshift(rec); renderAll();                       // 立即顯示
      content.value=""; newStatus.value=STATUSES[0]; newHandler.value=""; addBtn.disabled=true;
      syncing=true; setStatus("cloud","同步中…");
      cloudSend({action:"add", id:rec.id, content:rec.content, shift:rec.shift, person:rec.person, time:rec.time, status:rec.status, handler:rec.handler, log:logText})
        .then(applyRes).catch(syncErr);
      toast("✓ 已登記"); content.focus();
    }else{
      records.unshift(rec); saveLocal(REC_KEY,records);
      addLocalLog(logText);
      content.value=""; newStatus.value=STATUSES[0]; newHandler.value=""; addBtn.disabled=true;
      renderAll();
      toast("✓ 已登記"); content.focus();
    }
  }

  /* ================= 刪除 ================= */
  function delRecord(id){
    var r=findRec(id); if(!r) return;
    if(!confirm("確定刪除這筆紀錄？")) return;
    var logText="刪除事項「"+summ(r.content)+"」";
    if(USE_CLOUD){
      records=records.filter(function(x){ return x.id!==id; }); renderAll();  // 立即移除
      syncing=true; setStatus("cloud","同步中…");
      cloudSend({action:"delete", id:id, byShift:current.shift, byPerson:current.person, log:logText}).then(applyRes).catch(syncErr);
    }else{
      records=records.filter(function(x){ return x.id!==id; }); saveLocal(REC_KEY,records);
      addLocalLog(logText); renderAll();
    }
  }

  /* ================= 更新狀態 / 處理人員 ================= */
  function updateField(id, field, value){
    var r=findRec(id); if(!r) return;
    var logText;
    if(field==="status")      logText="將「"+summ(r.content)+"」狀態改為 "+parseStatus(value).base;
    else if(field==="handler")logText="將「"+summ(r.content)+"」認領狀態改為 "+(value||"未指派");
    else if(field==="content")logText="修改事由「"+summ(r.content)+"」→「"+summ(value)+"」";
    else if(field==="archived")logText=(value?"結案「":"還原「")+summ(r.content)+"」";
    else if(field==="pinned")  logText=(value?"置頂「":"取消置頂「")+summ(r.content)+"」";
    else if(field==="remind")  logText=(value?("設定提醒 "+fmtRemind(Number(value))+"「"):"取消提醒「")+summ(r.content)+"」";
    else                      logText="更新「"+summ(r.content)+"」";
    if(USE_CLOUD){
      r[field]=value; renderAll();                            // 立即套用
      syncing=true; setStatus("cloud","同步中…");
      cloudSend({action:"update", id:id, field:field, value:value, byShift:current.shift, byPerson:current.person, log:logText}).then(applyRes).catch(syncErr);
    }else{
      r[field]=value; saveLocal(REC_KEY,records);
      addLocalLog(logText); renderAll();
    }
  }
  function findRec(id){ for(var i=0;i<records.length;i++){ if(records[i].id===id) return records[i]; } return null; }

  // 接手防呆：已有人在處理時，換人前先確認
  function confirmTakeover(r, newClaim){
    if(!r || !r.handler) return true;                 // 沒人處理，直接放行
    if(r.handler===current.person+" "+newClaim) return true; // 沒有實際改變
    return window.confirm("這筆目前是「"+r.handler+"」。\n確定要改由「"+current.person+" "+newClaim+"」接手嗎？");
  }

  /* ================= 共用模式連線 ================= */
  function cloudList(){ return fetch(API_URL,{method:"GET"}).then(function(r){ return r.json(); }); }
  function cloudSend(payload){
    return fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)}).then(function(r){ return r.json(); });
  }
  function applyRes(res){
    syncing=false;
    if(res && res.ok){ records=res.records||[]; logs=res.logs||[]; lastSyncTime=Date.now(); setStatus("cloud","已同步"); renderAll(); }
    else{ setStatus("err","同步失敗，正在重新整理…"); loadCloud(false); }
  }
  function syncErr(){ syncing=false; setStatus("err","同步較慢或失敗，正在重新整理…"); loadCloud(false); }
  function cloudErr(){ setStatus("err","連線失敗，請檢查網路後重試"); }
  function loadCloud(first){
    if(first) list.innerHTML='<div class="empty"><div class="big">⏳</div>載入中…</div>';
    var btns=document.querySelectorAll(".recRefresh"); Array.prototype.forEach.call(btns,function(b){ b.classList.add("spin"); });
    cloudList().then(function(res){
      if(res && res.ok){ records=res.records||[]; logs=res.logs||[]; lastSyncTime=Date.now(); setStatus("cloud","共用模式：已連線"); renderAll(); purgeArchived(); }
      else{ setStatus("err","讀取失敗，請按重新整理再試"); }
    }).catch(function(){ setStatus("err","連線失敗，請確認 API 網址與網路"); })
      .then(function(){ var b2=document.querySelectorAll(".recRefresh"); Array.prototype.forEach.call(b2,function(b){ b.classList.remove("spin"); }); });
  }
  // 已結案逾 24 小時：自動從資料庫刪除（串行刪、刪完再刷新）
  function purgeArchived(){
    if(!USE_CLOUD || syncing) return;
    var now=Date.now();
    var expired=records.filter(function(r){ if(isPinned(r)) return false; var t=archivedAt(r); return t && (now-t)>ARCHIVE_TTL_MS; });
    if(expired.length===0) return;
    var i=0;
    (function next(){
      if(i>=expired.length){ loadCloud(false); return; }
      var r=expired[i++];
      cloudSend({action:"delete", id:r.id}).then(next).catch(next);
    })();
  }
  document.addEventListener("click", function(e){ if(e.target.closest(".recRefresh") && USE_CLOUD) loadCloud(false); });
  function startPoll(){ stopPoll(); pollTimer=setInterval(function(){ if(USE_CLOUD && current && !editing && !syncing) loadCloud(false); }, POLL_MS); }
  function stopPoll(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }
  function setStatus(kind,text){ statusBox.className="status "+kind; statusText.textContent=text; }

  /* ================= 單機模式儲存 ================= */
  function saveLocal(key,val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
  function loadLocal(key){ try{ var r=localStorage.getItem(key); return r?JSON.parse(r):[]; }catch(e){ return []; } }
  function addLocalLog(text){
    logs.unshift({ time:Date.now(), shift:current.shift, person:current.person, action:text });
    logs=pruneLogs(logs); saveLocal(LOG_KEY,logs);
  }
  function pruneLogs(arr){ var now=Date.now(); return (arr||[]).filter(function(l){ return now-Number(l.time) <= LOG_TTL_MS; }); }
  function pruneArchivedLocal(arr){ var now=Date.now(); return (arr||[]).filter(function(r){ if(isPinned(r)) return true; var t=archivedAt(r); return !(t && (now-t)>ARCHIVE_TTL_MS); }); }

  /* ================= 顯示 ================= */
  filter.addEventListener("change", renderRecords);
  search.addEventListener("input", renderRecords);
  if($("logSearch")) $("logSearch").addEventListener("input", renderLogs);
  function toast(msg){
    var t=document.createElement("div"); t.className="toast"; t.textContent=msg;
    document.body.appendChild(t);
    requestAnimationFrame(function(){ t.classList.add("show"); });
    setTimeout(function(){ t.classList.remove("show"); setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 300); }, 1600);
  }
  function renderAll(){ renderRecords(); renderLogs(); renderBoard(); }

  /* ===== 今日公告欄（共用；存成特殊紀錄，不影響後端結構） ===== */
  var boardEditing=false, boardTimer=null;
  function isBoard(r){ return r && r.id===BOARD_ID; }
  function getBoardRec(){ for(var i=0;i<records.length;i++){ if(records[i].id===BOARD_ID) return records[i]; } return null; }
  function renderBoard(){
    var d=new Date(), wk=["日","一","二","三","四","五","六"][d.getDay()];
    boardDate.textContent=(d.getMonth()+1)+"月"+d.getDate()+"日 週"+wk;
    if(boardEditing) return; // 有人正在打字就不覆蓋
    var r=getBoardRec();
    boardText.value = r ? r.content : "";
  }
  function flashBoard(msg){ boardStatus.textContent=msg; setTimeout(function(){ if(boardStatus.textContent===msg) boardStatus.textContent=""; }, 1500); }
  function saveBoard(text){
    if(!current) return;
    var r=getBoardRec();
    if(r){
      r.content=text;
      if(USE_CLOUD){ syncing=true; setStatus("cloud","同步中…");
        cloudSend({action:"update", id:BOARD_ID, field:"content", value:text, byShift:current.shift, byPerson:current.person, log:"更新今日公告"}).then(applyRes).catch(syncErr);
      }else{ saveLocal(REC_KEY,records); }
    }else{
      var rec={ id:BOARD_ID, content:text, shift:current.shift, person:current.person, time:Date.now(), status:"待處理", handler:"", pinned:"", archived:"" };
      records.push(rec);
      if(USE_CLOUD){ syncing=true; setStatus("cloud","同步中…");
        cloudSend({action:"add", id:BOARD_ID, content:text, shift:rec.shift, person:rec.person, time:rec.time, status:rec.status, handler:"", log:"建立今日公告"}).then(applyRes).catch(syncErr);
      }else{ saveLocal(REC_KEY,records); }
    }
    flashBoard("已儲存 ✓");
  }
  boardText.addEventListener("focus", function(){ boardEditing=true; });
  boardText.addEventListener("blur", function(){
    boardEditing=false;
    var r=getBoardRec(), cur=(r?r.content:"");
    if(boardText.value!==cur) saveBoard(boardText.value);
  });
  boardClear.addEventListener("click", function(e){
    e.stopPropagation();
    if(!confirm("確定清空今日公告？")) return;
    boardText.value=""; saveBoard("");
  });
  boardToggle.addEventListener("click", function(e){ e.stopPropagation(); toggleBoard(); });
  boardHead.addEventListener("click", function(e){ if(e.target.closest(".board-btn")) return; toggleBoard(); });
  function toggleBoard(){
    var on=!board.classList.contains("collapsed");
    board.classList.toggle("collapsed", on);
    boardToggle.textContent = on ? "展開" : "收合";
    try{ localStorage.setItem("board-collapsed", on?"1":"0"); }catch(e){}
  }
  (function initBoardCollapse(){
    if(localStorage.getItem("board-collapsed")==="1"){ board.classList.add("collapsed"); boardToggle.textContent="展開"; }
  })();

  /* 事由裡「像訂單號的長串」自動變成可點擊複製 */
  function renderBody(bodyEl, text){
    bodyEl.textContent="";
    text=String(text||"");
    var re=/[0-9A-Za-z]{8,}/g, last=0, m;
    while((m=re.exec(text))){
      var tok=m[0], digits=(tok.match(/[0-9]/g)||[]).length;
      if(m.index>last) bodyEl.appendChild(document.createTextNode(text.slice(last,m.index)));
      if(digits>=8){
        var span=document.createElement("span"); span.className="ordno"; span.textContent=tok; span.title="點擊複製";
        span.addEventListener("click", (function(t){ return function(){ copyText(t, this); }; })(tok));
        bodyEl.appendChild(span);
      }else{
        bodyEl.appendChild(document.createTextNode(tok));
      }
      last=m.index+tok.length;
    }
    if(last<text.length) bodyEl.appendChild(document.createTextNode(text.slice(last)));
  }
  function copyText(t, el){
    var flash=function(){
      if(!el) return;
      var old=el.textContent; el.classList.add("copied"); el.textContent="已複製 ✓";
      setTimeout(function(){ el.textContent=old; el.classList.remove("copied"); }, 1000);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(flash).catch(function(){ fallbackCopy(t, flash); });
    }else fallbackCopy(t, flash);
  }
  function fallbackCopy(t, done){
    try{
      var ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); done();
    }catch(e){}
  }

  function isArchived(r){ var a=r.archived; return !!a && a!=="0"; }
  function archivedAt(r){ var t=Number(r.archived); return t>1e12 ? t : 0; } // 只認合理的時間戳
  function isPinned(r){ var p=r.pinned; return !!p && p!=="0"; }
  function remindAt(r){ var t=Number(r.remind); return t>1e12 ? t : 0; }
  function hasRemind(r){ return remindAt(r)>0; }
  function isDue(r){ var t=remindAt(r); return t && Date.now()>=t && !isArchived(r); }
  function fmtRemind(ts){ var d=new Date(ts),now=new Date(),p=function(n){return(n<10?"0":"")+n;};
    var hm=p(d.getHours())+":"+p(d.getMinutes());
    return d.toDateString()===now.toDateString() ? ("今天 "+hm) : ((d.getMonth()+1)+"/"+d.getDate()+" "+hm); }
  function toLocalInput(ts){ var d=new Date(ts),p=function(n){return(n<10?"0":"")+n;};
    return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes()); }
  var remindTargetId=null;
  function todayAt(hm){ var p=hm.split(":"),d=new Date(); d.setHours(+p[0],+p[1],0,0); return d.getTime(); }
  function openRemindPicker(id){
    var r=findRec(id); if(!r) return;
    remindTargetId=id;
    $("remindSub").textContent=summ(r.content);
    $("remindInput").value = hasRemind(r) ? toLocalInput(remindAt(r)) : toLocalInput(Date.now()+3600000);
    $("remindClear").style.display = hasRemind(r) ? "" : "none";
    $("remindModal").classList.add("show");
  }
  function closeRemind(){ $("remindModal").classList.remove("show"); remindTargetId=null; }
  (function(){
    var rm=$("remindModal");
    $("remindQuick").addEventListener("click", function(e){
      var b=e.target.closest("button"); if(!b || !remindTargetId) return;
      var ts=0;
      if(b.dataset.min) ts=Date.now()+Number(b.dataset.min)*60000;
      else if(b.dataset.today) ts=todayAt(b.dataset.today);
      else if(b.dataset.tomorrow) ts=todayAt(b.dataset.tomorrow)+86400000;
      if(ts){ updateField(remindTargetId,"remind",String(ts)); closeRemind(); }
    });
    $("remindSet").addEventListener("click", function(){
      var v=$("remindInput").value;
      if(v && remindTargetId){ updateField(remindTargetId,"remind",String(new Date(v).getTime())); closeRemind(); }
    });
    $("remindClear").addEventListener("click", function(){ if(remindTargetId){ updateField(remindTargetId,"remind",""); closeRemind(); } });
    $("remindCancel").addEventListener("click", closeRemind);
    rm.addEventListener("click", function(e){ if(e.target===rm) closeRemind(); });
  })();

  function renderRecords(){
    var f=filter.value;
    var viewArchived = (f==="__archived");
    var q=(search.value||"").trim().toLowerCase();
    var now=Date.now();
    var shown=records.filter(function(r){
      if(isBoard(r)) return false;
      if(viewArchived){ if(!isArchived(r)) return false; }
      else{ if(isArchived(r)) return false; if(f!=="all" && r.shift!==f) return false; }
      if(q){ if(r.content.toLowerCase().indexOf(q)<0) return false; }
      if(quickFilter && !viewArchived){
        var ps=parseStatus(r.status);
        if(quickFilter==="todo" && ps.base!=="待處理") return false;
        if(quickFilter==="chase" && !(ps.base==="已給資料" && ps.at && (now-ps.at)>=WARN_MS && !r.handler)) return false;
      }
      return true;
    });
    if(!viewArchived) shown.sort(function(a,b){ var pa=isPinned(a)?0:1, pb=isPinned(b)?0:1; return pa!==pb ? pa-pb : b.time-a.time; });
    count.textContent="共 "+shown.length+" 筆";
    updateCounts();
    if(shown.length===0){
      var msg = viewArchived ? "目前沒有已結案的紀錄。"
              : (quickFilter==="chase" ? "目前沒有待跟催的紀錄 🎉"
              : (quickFilter==="todo" ? "目前沒有待處理的紀錄。"
              : (records.filter(function(r){return !isBoard(r) && !isArchived(r);}).length===0 ? "還沒有任何登記，於上方輸入後按「登記事項」。"
              : (q ? "找不到符合「"+search.value.trim()+"」的紀錄。" : "這個班別目前沒有紀錄。"))));
      list.innerHTML='<div class="empty"><div class="big">🔍</div>'+msg+'</div>';
      return;
    }
    list.innerHTML="";
    shown.forEach(function(r){
      var el=document.createElement("div"); el.className="rec"+(isPinned(r)?" pinned":""); el.setAttribute("data-shift",r.shift);

      var meta=document.createElement("div"); meta.className="rec-side";
      meta.innerHTML='<span class="tag" data-shift="'+r.shift+'">'+r.shift+'</span>'+
        '<div class="person-row"><span class="rec-person"></span></div>'+
        '<span class="rec-time">'+fmt(r.time)+'</span>';
      meta.querySelector(".rec-person").textContent=r.person;

      var body=document.createElement("div"); body.className="rec-body"; renderBody(body, r.content);

      var ps=parseStatus(r.status); var baseStatus=ps.base;
      el.dataset.base=baseStatus; el.dataset.at=ps.at||0; el.dataset.handler=r.handler||""; el.dataset.archived=isArchived(r)?"1":""; el.dataset.remind=remindAt(r)||0;

      var fields=document.createElement("div"); fields.className="rec-fields";
      // 狀態
      var sf=document.createElement("div"); sf.className="minifield";
      var sSel=document.createElement("select"); sSel.className="pick "+(STATUS_CLASS[baseStatus]||"st-todo");
      STATUSES.forEach(function(s){ var o=document.createElement("option"); o.value=s; o.textContent=s; if(s===baseStatus)o.selected=true; sSel.appendChild(o); });
      sSel.addEventListener("change", function(){ updateField(r.id,"status",encodeStatus(sSel.value)); });
      sf.appendChild(sSel);
      // 認領（處理中 / 補單中）
      var hf=document.createElement("div"); hf.className="minifield";
      var hcls = r.handler ? (r.handler.indexOf("補單")>=0 ? "hs-supp" : "hs-doing") : "";
      var hSel=document.createElement("select"); hSel.className="pick "+hcls;
      var cur=document.createElement("option"); cur.value="__keep__"; cur.textContent=r.handler ? r.handler : "未指派"; cur.selected=true; hSel.appendChild(cur);
      CLAIMS.forEach(function(c){ var o=document.createElement("option"); o.value=c; o.textContent=c; hSel.appendChild(o); });
      if(r.handler){ var oc=document.createElement("option"); oc.value="__clear__"; oc.textContent="取消"; hSel.appendChild(oc); }
      hSel.addEventListener("change", function(){
        var v=hSel.value;
        if(v==="__keep__") return;
        if(v==="__clear__"){ updateField(r.id,"handler",""); return; }
        if(!confirmTakeover(r, v)){ hSel.value="__keep__"; return; }
        updateField(r.id,"handler", current.person+" "+v);
      });
      hf.appendChild(hSel);

      fields.appendChild(sf); fields.appendChild(hf);

      var acts=document.createElement("div"); acts.className="rec-acts";
      var editBtn=document.createElement("button"); editBtn.className="rec-edit"; editBtn.textContent="編輯";

      if(viewArchived){
        // 已結案檢視：還原 + 徹底刪除
        var restoreBtn=document.createElement("button"); restoreBtn.className="rec-edit"; restoreBtn.textContent="還原";
        restoreBtn.addEventListener("click", function(){ updateField(r.id,"archived",""); });
        var del=document.createElement("button"); del.className="rec-del"; del.textContent="刪除";
        del.addEventListener("click", function(){ delRecord(r.id); });
        acts.appendChild(restoreBtn); acts.appendChild(del);
      }else{
        // 提醒⏰、置頂📌 → 名字右邊的小圖示；編輯、結案在右
        var pr=meta.querySelector(".person-row");
        var remBtn=document.createElement("button"); remBtn.className="icon-btn rem"+(hasRemind(r)?" on":"")+(isDue(r)?" due":"");
        remBtn.textContent="⏰"; remBtn.title=hasRemind(r)?("提醒："+fmtRemind(remindAt(r))+(isDue(r)?"（到點）":"")):"設定提醒";
        remBtn.addEventListener("click", function(){ openRemindPicker(r.id); });
        var pinBtn=document.createElement("button"); pinBtn.className="icon-btn pin"+(isPinned(r)?" on":"");
        pinBtn.textContent="📌"; pinBtn.title=isPinned(r)?"取消置頂":"置頂";
        pinBtn.addEventListener("click", function(){ updateField(r.id,"pinned", isPinned(r)?"":"1"); });
        pr.appendChild(remBtn); pr.appendChild(pinBtn);
        if(isDue(r)){ var dis=document.createElement("button"); dis.className="icon-btn dis"; dis.textContent="✓"; dis.title="知道了（清除提醒）"; dis.addEventListener("click", function(){ updateField(r.id,"remind",""); }); pr.appendChild(dis); }
        var closeBtn=document.createElement("button"); closeBtn.className="rec-close"; closeBtn.textContent="結案";
        closeBtn.addEventListener("click", function(){
          if(!confirm("將這筆結案（歸檔）？之後可到「已結案」查看或還原。")) return;
          updateField(r.id,"archived",String(Date.now()));
        });
        acts.appendChild(editBtn); acts.appendChild(closeBtn);
      }

      var main=document.createElement("div"); main.className="rec-main";
      main.appendChild(body); main.appendChild(fields); main.appendChild(acts);

      editBtn.addEventListener("click", function(){
        editing=true;
        var box=document.createElement("div"); box.className="edit-box";
        var ta=document.createElement("textarea"); ta.className="edit-ta"; ta.value=r.content;
        var row=document.createElement("div"); row.className="edit-row";
        var cancel=document.createElement("button"); cancel.className="edit-cancel"; cancel.textContent="取消";
        var save=document.createElement("button"); save.className="edit-save"; save.textContent="儲存";
        row.appendChild(cancel); row.appendChild(save);
        box.appendChild(ta); box.appendChild(row);
        main.replaceChild(box, body);
        fields.style.display="none"; acts.style.display="none";
        ta.focus();
        cancel.addEventListener("click", function(){ editing=false; renderRecords(); });
        save.addEventListener("click", function(){
          var nv=ta.value.trim();
          if(!nv){ ta.focus(); return; }
          editing=false;
          if(nv===r.content){ renderRecords(); return; }
          updateField(r.id,"content",nv);
        });
      });

      el.appendChild(meta); el.appendChild(main);
      list.appendChild(el);
    });
    updateWarnings();
  }

  var warnTimer=null;
  function updateWarnings(){
    var now=Date.now();
    var cards=list.querySelectorAll(".rec");
    Array.prototype.forEach.call(cards, function(el){
      var base=el.dataset.base, at=Number(el.dataset.at)||0;
      var claimed=!!(el.dataset.handler||"");
      var warn = (base==="已給資料" && at && (now-at)>=WARN_MS && !claimed && el.dataset.archived!=="1");
      el.classList.toggle("warn", warn);
      var rmd=Number(el.dataset.remind)||0;
      el.classList.toggle("due", !warn && rmd>0 && now>=rmd && el.dataset.archived!=="1");
    });
    updateCounts();
    checkNotify();
  }
  function startWarn(){ stopWarn(); warnTimer=setInterval(updateWarnings, 15000); }
  function stopWarn(){ if(warnTimer){ clearInterval(warnTimer); warnTimer=null; } }

  /* ===== 頂部待辦計數 ===== */
  function updateCounts(){
    var now=Date.now(), todo=0, chase=0, due=0;
    records.forEach(function(r){
      if(isBoard(r)||isArchived(r)) return;
      var ps=parseStatus(r.status);
      if(ps.base==="待處理") todo++;
      if(ps.base==="已給資料" && ps.at && (now-ps.at)>=WARN_MS && !r.handler) chase++;
      var rt=remindAt(r); if(rt && now>=rt) due++;
    });
    var html='<span class="cbadge">待處理 '+todo+'</span>';
    if(chase>0) html+='<span class="cbadge warn">待跟催 '+chase+'</span>';
    if(due>0) html+='<span class="cbadge due">⏰ 到點 '+due+'</span>';
    counts.innerHTML=html;
    if(todoBadges){
      todoBadges.innerHTML=
        '<span class="tbadge tb-todo'+(quickFilter==="todo"?" active":"")+'" data-qf="todo">待處理 '+todo+'</span>'+
        '<span class="tbadge tb-chase'+(quickFilter==="chase"?" active":"")+'" data-qf="chase">待跟催 '+chase+'</span>';
    }
    updateMini();
  }
  if(todoBadges) todoBadges.addEventListener("click", function(e){
    var b=e.target.closest(".tbadge"); if(!b) return;
    var qf=b.dataset.qf;
    quickFilter = (quickFilter===qf) ? "" : qf;      // 再點一次取消
    if(quickFilter && filter.value==="__archived") filter.value="all"; // 離開已結案檢視
    renderRecords();
  });

  /* ===== 一鍵匯出當天紀錄（CSV） ===== */
  exportBtn.addEventListener("click", exportToday);
  function exportToday(){
    var now=new Date(), y=now.getFullYear(), m=now.getMonth(), d=now.getDate();
    var todays=records.filter(function(r){
      if(isBoard(r)) return false;
      var t=new Date(r.time); return t.getFullYear()===y && t.getMonth()===m && t.getDate()===d;
    });
    if(todays.length===0){ alert("今天還沒有任何登記紀錄。"); return; }
    todays.sort(function(a,b){ return a.time-b.time; });
    var rows=[["時間","班別","登記人","事由","處理狀態","認領","狀態"]];
    todays.forEach(function(r){
      rows.push([ fmt(r.time), r.shift, r.person, r.content, parseStatus(r.status).base, r.handler||"", isArchived(r)?"已結案":"進行中" ]);
    });
    var csv=rows.map(function(row){
      return row.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(",");
    }).join("\r\n");
    var p=function(n){return(n<10?"0":"")+n;};
    var fname="四方相通_"+y+p(m+1)+p(d)+".csv";
    var blob=new Blob([" \uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
    var url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download=fname; document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  }

  function renderLogs(){
    var q=(logSearch&&logSearch.value||"").trim().toLowerCase();
    var shown = q ? logs.filter(function(l){ return (l.action+" "+l.person).toLowerCase().indexOf(q)>=0; }) : logs;
    logCount.textContent="共 "+shown.length+" 筆";
    if(shown.length===0){
      logList.innerHTML='<div class="empty"><div class="big">🕓</div>'+(q?"找不到符合的日誌。":"近 24 小時內沒有操作紀錄。")+'</div>';
      return;
    }
    logList.innerHTML="";
    shown.forEach(function(l){
      var el=document.createElement("div"); el.className="log";
      var t=document.createElement("span"); t.className="log-time"; t.textContent=fmtShort(l.time);
      var who=document.createElement("span"); who.className="log-who"; who.setAttribute("data-shift",l.shift); who.textContent=l.person;
      var act=document.createElement("span"); act.className="log-act"; act.textContent=l.action;
      el.appendChild(t); el.appendChild(who); el.appendChild(act);
      logList.appendChild(el);
    });
  }

  function fmt(ts){ var d=new Date(ts),p=function(n){return(n<10?"0":"")+n;};
    return d.getFullYear()+"/"+p(d.getMonth()+1)+"/"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes()); }
  function fmtShort(ts){ var d=new Date(ts),p=function(n){return(n<10?"0":"")+n;};
    return p(d.getMonth()+1)+"/"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes()); }

  /* ================= 登入身分暫存（刷新不登出） ================= */
  var SESSION_KEY="shift-session-v1";
  function saveSession(){ try{ sessionStorage.setItem(SESSION_KEY, JSON.stringify(current)); }catch(e){} }
  function clearSession(){ try{ sessionStorage.removeItem(SESSION_KEY); }catch(e){} }
  function loadSession(){ try{ var r=sessionStorage.getItem(SESSION_KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }

  // 頁面載入時，若先前已登入則自動恢復（不必重新輸入密碼）
  (function restore(){
    var s=loadSession();
    if(s && s.shift && STAFF[s.shift] && s.person){
      current={ shift:s.shift, person:s.person };
      selectedShift=s.shift;
      enterApp();
    }
  })();
})();
</script>
</body>
